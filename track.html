<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | Farvine</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="components/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { farvine: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' } },
                    fontFamily: { sans: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="js/main.js" defer></script>
</head>

<body class="bg-gray-50 text-gray-800 selection:bg-farvine-200 selection:text-farvine-900 overflow-x-hidden min-h-screen flex flex-col">

    <div id="header"></div>

    <main class="flex-grow py-16 px-6">
        <div class="max-w-2xl mx-auto">
            
            <div class="text-center mb-12 fade-up">
                <h1 class="text-4xl font-black text-gray-900 tracking-tight mb-4">Track Your Harvest</h1>
                <p class="text-gray-500 font-light text-lg">Enter your Order Number (e.g., FRV-XXXX) or the phone number used during checkout.</p>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-xl shadow-gray-200/50 border border-gray-100 fade-up delay-100 relative mb-8">
                <form id="trackForm" class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="traceInput" placeholder="Order Number or Phone..." 
                           class="flex-1 border border-gray-200 p-4 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-farvine-500 focus:border-transparent transition-all text-lg" required>
                    <button type="submit" class="bg-gray-900 text-white font-bold px-8 py-4 rounded-xl hover:bg-farvine-500 transition-all shadow-lg hover:shadow-farvine-500/20 whitespace-nowrap">
                        Find Order
                    </button>
                </form>
            </div>

            <div id="resultsContainer" class="space-y-6">
                <!-- Results injected via JS -->
            </div>

            <div id="errorState" class="hidden text-center p-8 bg-red-50 rounded-2xl border border-red-100 text-red-600 mt-8">
                <svg class="w-10 h-10 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p id="errorTxt" class="font-bold text-lg">No order found.</p>
            </div>

        </div>
    </main>

    <div id="footer"></div>

    <script>
    document.getElementById("trackForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const input = document.getElementById("traceInput").value.trim();
        const resultsContainer = document.getElementById("resultsContainer");
        const errorState = document.getElementById("errorState");
        const btn = this.querySelector("button");

        btn.innerText = "Searching...";
        btn.disabled = true;
        
        resultsContainer.innerHTML = '';
        errorState.classList.add("hidden");

        try {
            let res = await fetch(`api/track_order.php?q=${encodeURIComponent(input)}`);
            let data = await res.json();

            if(data.status === "success") {
                data.orders.forEach(order => {
                    let statusColor = "bg-yellow-100 text-yellow-700";
                    if(order.order_status === "Shipped") statusColor = "bg-blue-100 text-blue-700";
                    if(order.order_status === "Delivered") statusColor = "bg-green-100 text-green-700";
                    if(order.order_status === "Cancelled") statusColor = "bg-red-100 text-red-700";

                    let itemsHtml = order.items.map(item => `<div class="mb-1"><span class="font-medium text-gray-800">${item.variety_name}</span> <span class="text-sm text-gray-500">(x${item.quantity} Kg)</span></div>`).join('');

                    let card = document.createElement("div");
                    card.className = "bg-white border border-gray-100 p-6 rounded-2xl shadow-md animate-[fadeIn_0.3s_ease]";
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4 border-b border-gray-100 pb-4">
                            <div>
                                <p class="text-sm text-gray-400 font-bold tracking-wider mb-1">ORDER ID</p>
                                <p class="text-xl font-black text-gray-900">${order.order_number}</p>
                                <p class="text-gray-500 text-sm mt-1">${order.created_at}</p>
                            </div>
                            <span class="px-4 py-1.5 rounded-full font-bold text-sm ${statusColor}">${order.order_status}</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-2">Items Ordered</p>
                                ${itemsHtml}
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-1">Grand Total</p>
                                <p class="text-2xl font-black text-farvine-600">₹${order.total_price}</p>
                            </div>
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                });
            } else {
                errorState.classList.remove("hidden");
                document.getElementById("errorTxt").innerText = data.message;
            }
        } catch(err) {
            errorState.classList.remove("hidden");
            document.getElementById("errorTxt").innerText = "Connection error. Please try again later.";
        } finally {
            btn.innerText = "Find Order";
            btn.disabled = false;
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if(entry.isIntersecting){ entry.target.classList.add("show"); obs.unobserve(entry.target); }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    });
    </script>
</body>
</html>
